# Profilo dev - Testcontainers Spring Boot dev mode (ADR-044).
#
# Datasource MySQL: NON configurato qui. Forniato da TestServerApplication tramite
# @Bean @ServiceConnection MySQLContainer<>("mysql:8.0") quando si avvia con
#   mvn -pl server spring-boot:test-run
# Spring Boot legge l'URL/porta dinamica del container e li inietta nel context.
#
# Container effimero: ricreato ad ogni avvio del processo. Per ispezione in MySQL
# Workbench: vedere il log al boot per "MySQL container started ... port", aggiornare
# la connessione Workbench una volta per sessione di sviluppo.

spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false  # consente flyway:clean su DB ephemeral

dama:
  jwt:
    # DEV-ONLY default: mai usare in produzione. ADR-045 documenta la strategia
    # (warning log a runtime + fail-fast in profilo prod). Override con JWT_SECRET
    # env var se per qualche motivo si vuole un secret stabile in dev.
    secret: ${JWT_SECRET:dev-only-secret-change-me-32bytes-min-padding-xxxxxx}

logging:
  level:
    com.damaitaliana: DEBUG
    org.hibernate.SQL: DEBUG
