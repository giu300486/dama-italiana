# Dama Italiana - server centrale (Spring Boot)
#
# Configurazione COMUNE a tutti i profili. Profilo specifico OBBLIGATORIO via
# SPRING_PROFILES_ACTIVE (env var) o -Dspring.profiles.active (system property).
#
# Profili supportati (vedi ARCHITECTURE.md ADR-044 + ADR-049):
#   - dev   : sviluppo locale, MySQL nativo localhost:3306/dama_italiana_dev.
#             Comando: mvn -pl server spring-boot:run -Dspring-boot.run.profiles=dev.
#   - test  : fast loop unit/slice/integration, H2 in-memory MySQL-compat.
#             Attivato via @ActiveProfiles("test") nei test.
#   - it    : integration test full-stack con MySQL nativo localhost:3306/dama_italiana_it
#             (@Tag("slow")). Attivato via @ActiveProfiles("it") + AbstractMysqlIntegrationTest.
#   - prod  : deploy reale, MySQL nativo installato sul server, secret via env var
#             (JWT_SECRET, SPRING_DATASOURCE_*). Fail-fast su env var assente.
#
# La datasource e il JWT secret NON sono configurati qui: ogni profilo li dichiara
# secondo la propria strategia (MySQL nativo locale per dev/it/prod, H2 per test).

spring:
  application:
    name: dama-italiana-server
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    fail-on-missing-locations: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

dama:
  jwt:
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    # secret: dichiarato per profilo (dev=default+warning, test/it=hardcoded yaml,
    # prod=env var fail-fast). Vedi ADR-045.

logging:
  level:
    root: INFO
    com.damaitaliana: INFO
